<button type="button" id="form-help-toggle" aria-label="Open AI assistant"
        aria-expanded="false" aria-controls="form-help">
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
    <path d="M20 11.5a8 8 0 0 1-8 8H4l-2 2v-10a9 9 0 0 1 18 0Z"/>
    <path d="M7 10h8M7 14h5"/>
  </svg>
</button>

<section id="form-help" role="dialog" aria-modal="false" aria-labelledby="form-help-title"
         data-url="{% url 'admin_form_help' %}" data-user-id="{{ user.pk }}"
         {% if opts.app_label == "tickets" %}
           data-model="{{ opts.model_name }}" data-object-id="{{ original.pk|default_if_none:'' }}"
         {% endif %}
         hidden>
  <header class="form-help-header">
    <div>
      <h2 id="form-help-title">AI assistant</h2>
      <p>Form help &amp; record summaries</p>
    </div>
    <button type="button" id="form-help-close" aria-label="Close AI assistant">×</button>
  </header>

  <div class="form-help-picker">
    <label for="form-help-model">Form</label>
    <select id="form-help-model">
      {% if perms.tickets.view_ticket or perms.tickets.add_ticket or perms.tickets.change_ticket %}<option value="ticket">Ticket</option>{% endif %}
      {% if perms.tickets.view_customer or perms.tickets.add_customer or perms.tickets.change_customer %}<option value="customer">Customer</option>{% endif %}
      {% if perms.tickets.view_agent or perms.tickets.add_agent or perms.tickets.change_agent %}<option value="agent">Agent</option>{% endif %}
    </select>
    <p id="form-help-context"></p>
  </div>

  <div id="form-help-messages" role="log" aria-label="Conversation" aria-live="polite"></div>

  <div class="form-help-actions" aria-label="Suggested questions">
    <button type="button" data-question="Help me complete this form. Explain visible errors or missing required inputs.">Help with this form</button>
    <button type="button" id="form-help-summary" data-question="Summarize this record and its directly linked records. Note unsaved changes separately.">Summarize record</button>
  </div>
  <p id="form-help-status" role="status" hidden></p>

  <form id="form-help-form" class="form-help-composer">
    {% csrf_token %}
    <label class="visually-hidden" for="form-help-question">Ask about this form or record</label>
    <div class="form-help-input">
      <textarea id="form-help-question" rows="2" maxlength="1000" required
                placeholder="Ask about this form or record…"></textarea>
      <button type="submit" id="form-help-send">Send</button>
    </div>
    <p>OpenAI receives this record, direct relationships, current inputs and visible errors. Files are not read. Nothing is saved by the assistant.</p>
  </form>
</section>
