[project]
name = "support-ticket-tracker"
version = "0.1.0"
description = "A focused support queue built with Django admin."
requires-python = ">=3.12,<3.14"
dependencies = [
  "django>=5.2,<5.3",
  "dj-database-url>=3,<4",
  "psycopg[binary]>=3.2,<4",
  "django-storages[s3]>=1.14,<2",
  "whitenoise>=6.9,<7",
  "gunicorn>=23,<24",
  "pillow>=11,<13",
  "openai>=2,<3",
  "faker>=37,<40",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-django>=4.11,<5", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.test_settings"
testpaths = ["tickets/tests"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
